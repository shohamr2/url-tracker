<!DOCTYPE html>
<html lang="he">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ניהול משחק</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

:root{
--bg: #0f172a;
--panel: #0b1220;
--panel-2: #111a2b;
--card: #101b2e;
--accent: #f59e0b;
--accent-2: #22c55e;
--text: #e5e7eb;
--muted: #9aa4b2;
--danger: #ef4444;
}

body{
margin:0;
display:flex;
height:100vh;
font-family:"Rubik", "Assistant", "Noto Sans Hebrew", sans-serif;
background:
radial-gradient(1200px 600px at 10% -10%, #1f2937, transparent 60%),
radial-gradient(900px 500px at 90% 0%, #0b1220, transparent 55%),
var(--bg);
color:var(--text);
}

#sidebar{
width:320px;
background:linear-gradient(180deg, var(--panel), var(--panel-2));
padding:18px 16px;
display:flex;
flex-direction:column;
gap:12px;
border-right:1px solid rgba(255,255,255,0.08);
}

#map{
flex:1;
}

.title{
margin:0;
font-size:20px;
letter-spacing:0.5px;
}

.subtitle{
margin:0;
color:var(--muted);
font-size:12px;
}

.actions{
display:flex;
gap:8px;
}

.players-wrap{
flex:1;
overflow:auto;
padding-right:4px;
}

.player{
background:var(--card);
padding:10px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
box-shadow:0 6px 16px rgba(0,0,0,0.25);
border:1px solid rgba(255,255,255,0.06);
}

.player:hover{
border-color:rgba(255,255,255,0.18);
}

.player-name{
font-weight:600;
}

input{
width:100%;
padding:10px 12px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.1);
background:#0c1425;
color:var(--text);
}

button{
width:100%;
padding:9px 12px;
border:none;
border-radius:10px;
background:var(--accent);
color:#111827;
font-weight:700;
cursor:pointer;
}

.delete-btn{
background:var(--danger);
color:white;
margin-top:8px;
}

.bet-panel{
margin-top:6px;
}

.bet-item{
background:var(--card);
padding:8px;
border-radius:10px;
margin-bottom:8px;
border:1px solid rgba(255,255,255,0.06);
}

.bet-time{
color:var(--muted);
font-size:12px;
}

@media (max-width: 900px){
body{
flex-direction:column;
}
#sidebar{
width:100%;
height:55vh;
}
#map{
height:45vh;
}
}

</style>

</head>

<body>

<div id="sidebar">

<div>
<h2 class="title">שחקנים</h2>
<p class="subtitle">עדכון בזמן אמת</p>
</div>

<input id="search" placeholder="חפש שחקן">

<div class="actions">
<button onclick="centerAll()">מרכז את כולם</button>
</div>

<div class="players-wrap">
<div id="players"></div>
</div>

<div class="bet-panel">
<h3 class="title">הימורים מובילים</h3>
<div id="betLeaderboard"></div>
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const ADMIN_PASSWORD = new URLSearchParams(window.location.search).get("password") || ""

let map=L.map('map').setView([31.78,35.21],14)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

let markers={}

function getColor(username){

const colors=["#ef4444","#3b82f6","#22c55e","#f59e0b","#a855f7","#ec4899"]

let hash=0

for(let i=0;i<username.length;i++){
hash+=username.charCodeAt(i)
}

return colors[hash%colors.length]

}

function refresh(){

if (!ADMIN_PASSWORD) {
document.getElementById("players").innerHTML = "<div class='player'>חסר סיסמת ניהול</div>"
return
}

fetch(`/admin_locations?password=${ADMIN_PASSWORD}`)

.then(r=>r.json())

.then(players=>{

let list=document.getElementById("players")
list.innerHTML=""

players.forEach(player=>{

let color=getColor(player.username)

if(!markers[player.username]){

let marker=L.circleMarker(
[player.lat,player.lon],
{
radius:18,
color:color,
fillColor:color,
fillOpacity:0.9
}).addTo(map)

marker.bindTooltip(player.username,{permanent:true})

markers[player.username]=marker

}else{

markers[player.username].setLatLng([player.lat,player.lon])

}

let div=document.createElement("div")
div.className="player"
div.innerHTML=`
<div class="player-name">${player.username}</div>
<div class="bet-time">${player.time}</div>
<button class="delete-btn" onclick="deleteUser('${player.username}')">מחק</button>
`

div.onclick=()=>{

map.setView([player.lat,player.lon],18)

}

list.appendChild(div)

})

})

}

function centerAll(){

let group=[]

Object.values(markers).forEach(m=>{
group.push(m.getLatLng())
})

if(group.length>0){

let bounds=L.latLngBounds(group)

map.fitBounds(bounds)

}

}

document.getElementById("search").addEventListener("input",(e)=>{

let name=e.target.value.toLowerCase()

Object.keys(markers).forEach(user=>{

if(user.toLowerCase().includes(name)){

map.setView(markers[user].getLatLng(),18)

}

})

})

refresh()

setInterval(refresh,2000)

function refreshBetsStats(){

fetch("/bets")
.then(r=>r.json())
.then(bets=>{
let counts={}
let latestTimes={}
bets.forEach(item=>{
counts[item.bet]=(counts[item.bet]||0)+1
if(!latestTimes[item.bet]){
latestTimes[item.bet]=item.time
}
})

let list=document.getElementById("betLeaderboard")
list.innerHTML=""

let entries=Object.entries(counts).sort((a,b)=>b[1]-a[1])

if(entries.length==0){
list.innerHTML="<div class='bet-item'>אין הימורים</div>"
return
}

entries.forEach(([name,count])=>{
let div=document.createElement("div")
div.className="bet-item"
div.innerHTML=`<b>${name}</b> — ${count}<div class="bet-time">${latestTimes[name] || ""}</div>`
list.appendChild(div)
})
})

}

refreshBetsStats()
setInterval(refreshBetsStats,3000)

function deleteUser(username){

let password = prompt("הכנס סיסמה למחיקה")

if(!password) return

fetch("/delete_user",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username:username,
password:password
})

})
.then(r=>r.json())
.then(res=>{

if(res.status=="ok"){

alert("המשתמש נמחק")

refresh()

}else{

alert("סיסמה שגויה")

}

})

}

</script>

</body>

</html>
